[project]
name = "moa-mcp"
version = "0.1.0"
description = "Mixture-of-agents MCP server: run prompts across OpenAI, Ollama and OpenRouter models"
readme = "README.md"
authors = [
    { name = "Chris van Es", email = "cvanes@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "mcp>=2.0.0",
    "openai>=3.0.0",
    "python-dotenv>=1.2.2",
]

[project.scripts]
moa-mcp = "moa_mcp.server:main"

[build-system]
requires = ["uv_build>=0.11.7,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]
